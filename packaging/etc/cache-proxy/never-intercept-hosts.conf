# Hosts that bypass TLS interception (SSL-bump) entirely -- mitmproxy
# tunnels them raw, without decrypting. Use this for certificate-pinned
# apps and anything sensitive you don't want the proxy looking inside at
# all (banking, etc). Implies never-cache for the same host. Same format
# as never-cache-hosts.conf: one hostname pattern per line, "#" comments.
#
# mybank.example.com
# *.pinned-vendor.com
