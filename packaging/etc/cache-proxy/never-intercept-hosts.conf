# Hosts that bypass TLS interception (SSL-bump) entirely -- mitmproxy
# tunnels them raw, without decrypting. Use this for certificate-pinned
# apps and anything sensitive you don't want the proxy looking inside at
# all (banking, etc). Implies never-cache for the same host. Same format
# as never-cache-hosts.conf: one hostname pattern per line, "#" comments.
#
# mybank.example.com
# *.pinned-vendor.com

# ---------------------------------------------------------------------
# Two real Windows client incompatibilities found running this proxy
# against a Windows 11 desktop and a Windows Server 2022 print server
# (2026-09-23). Neither is a WFC-specific policy choice (unlike, say,
# excluding your own SaaS accounts on privacy grounds) -- these are
# generic technical incompatibilities a 3rd party deploying this proxy
# against real Windows clients should expect to hit too. Uncomment
# whichever apply to you; left commented here since not everyone runs
# Windows clients through this proxy at all.
# ---------------------------------------------------------------------

# SmartScreen -- certificate-pinned. Windows rejected the proxy's
# re-signed certificate with "Client TLS handshake failed... disconnected
# during the handshake" even with the mitmproxy CA correctly trusted in
# both LocalMachine\Root and CurrentUser\Root, which rules out a
# trust-store gap -- that signature (an abrupt disconnect with no TLS
# alert) is characteristic of pinning, not distrust. Not a download
# source, so excluding it costs no caching value.
# nav-edge.smartscreen.microsoft.com

# Windows Update's service-locator (SLS) infrastructure -- a different
# failure mode again: the TLS handshake itself succeeds (the CA is
# trusted), but Windows Update's own client does an *extra* validation
# on top of normal trust, checking for a 3-tier certificate chain
# (root -> intermediate -> leaf). mitmproxy's re-signed chain is only
# 2-tier (root signs the leaf directly), which fails that check
# unconditionally -- "Cert chain length check failed" / "Certificate
# failed SSL intermediate CA check" in Get-WindowsUpdateLog, with WU then
# reporting a generic SLS refresh failure (0x80245006) and silently
# never progressing past the service-locator step. No [tls_trust] seed
# host fixes this -- that mechanism fixes the proxy's *upstream*
# verification of the real Microsoft server; this is the *client's*
# extra validation of what the *proxy* presents, the opposite direction.
# Wildcarded on the apex, not the specific instance hostname you'll see
# in your own logs (e.g. tas02.sls.update.microsoft.com,
# fe2cr.update.microsoft.com) -- those are rotating pool identifiers
# Microsoft can reassign at any time; this pattern matches any of them.
# No caching value lost: actual downloadable content lives under
# windowsupdate.com and delivery.mp.microsoft.com, not this apex.
# update.microsoft.com
