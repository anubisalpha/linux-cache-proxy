# Hosts blocked by content filtering (needs [filtering] enabled = true in
# config.toml). One hostname per line, "#" for comments. A pattern matches the
# host and all its subdomains. Hosts-file format ("0.0.0.0 ads.example.com")
# is accepted too, so a public blocklist can be appended as-is.
#
# The file is re-read automatically within ~10 seconds of being saved; no
# restart needed. Don't also list a host in never-intercept-hosts.conf --
# tunnelled traffic can't be filtered.
#
# gambling.example.com
# *.adult-site.example
