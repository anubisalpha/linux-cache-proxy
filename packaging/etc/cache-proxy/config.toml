# cache-proxy configuration. Installed to /etc/cache-proxy/config.toml.
# Restart both services after editing:
#   sudo systemctl restart cache-proxy cache-webui

[cache]
dir = "/var/lib/cache-proxy/files"
db = "/var/lib/cache-proxy/index.db"

# Skip caching anything smaller than this (favicons, redirects, small API
# responses that happen to carry a cacheable content-type).
min_size_mb = 1

# Cap on how large a single file this will buffer in memory before writing
# it to disk. Anything bigger streams straight through uncached rather
# than risk holding a multi-GB ISO entirely in RAM.
max_buffer_size_mb = 512

# How long a cached download is served before it is fetched again.
download_ttl_days = 30

# When several clients request the same not-yet-cached file at once, the
# first fetches it and the others wait (up to this many seconds) and are
# then served from the cache, instead of each downloading it separately.
# 0 turns this off.
coalesce_wait_seconds = 60

# Cap on the total size of the cache in GB (downloads and web assets
# together); 0 = unlimited. Once exceeded, the least recently used entries
# are evicted first.
max_size_gb = 0

# File extensions treated as cacheable downloads (matched against the URL
# path, case-insensitive).
extensions = [
    ".exe", ".msi", ".msix", ".msixbundle", ".cab", ".appx",
    ".deb", ".rpm", ".tar.gz", ".tgz", ".tar.xz", ".tar.bz2", ".zip",
    ".iso", ".img", ".dmg", ".pkg", ".apk",
]

# Fallback for URLs with no recognizable extension (e.g. "/download?id=123") --
# matched against the response's Content-Type header.
content_types = [
    "application/octet-stream",
    "application/x-msdownload",
    "application/vnd.microsoft.portable-executable",
    "application/x-debian-package",
    "application/x-rpm",
    "application/x-redhat-package-manager",
    "application/zip",
    "application/gzip",
    "application/x-xz",
    "application/x-bzip2",
    "application/x-iso9660-image",
    "application/vnd.android.package-archive",
]

# Host exclusion lists live in their own files, not here:
#   /etc/cache-proxy/never-cache-hosts.conf
#   /etc/cache-proxy/never-intercept-hosts.conf

# Short-lived cache for static web assets (JS, CSS, images, fonts). HTML
# pages are deliberately never cached. The origin's own headers are always
# respected: responses marked no-store/private/no-cache, that set cookies,
# or that vary on anything but Accept-Encoding are not stored, and a shorter
# max-age from the origin wins over ttl_minutes.
[webcache]
enabled = true
ttl_minutes = 60
max_size_mb = 5
extensions = [
    ".js", ".mjs", ".css", ".png", ".jpg", ".jpeg", ".gif", ".webp",
    ".svg", ".ico", ".woff", ".woff2", ".ttf", ".otf",
]
content_types = [
    "text/css", "application/javascript", "text/javascript",
    "image/png", "image/jpeg", "image/gif", "image/webp",
    "image/svg+xml", "image/x-icon", "image/vnd.microsoft.icon",
    "font/woff", "font/woff2", "font/ttf", "font/otf",
]

# Worker pool. One mitmproxy process uses about one CPU core, so the proxy
# runs several. It starts min_workers, adds one when the pool's average CPU
# stays above scale_up_cpu_pct, and retires an idle one (no client
# connections) after the pool has been under scale_down_cpu_pct for
# scale_down_idle_seconds. max_workers = 0 means "number of CPUs".
[proxy]
min_workers = 2
max_workers = 0
scale_up_cpu_pct = 70
scale_down_cpu_pct = 20
scale_down_idle_seconds = 300
sample_interval_seconds = 5
status_file = "/var/lib/cache-proxy/workers.json"

# Usage analytics (/stats, /api/hourly-stats). A client is flagged when its
# current hour exceeds anomaly_factor x its own average, once it has at
# least min_history_hours of history. access_log rows older than
# retention_days are pruned daily (0 = keep forever).
[analytics]
anomaly_factor = 3.0
min_history_hours = 6
lookback_hours = 168
retention_days = 90

# Content filtering. Off until enabled = true (then restart cache-proxy).
# Category lists are downloaded daily into /var/lib/cache-proxy/filter-lists
# (separate from /etc) by the cache-proxy-lists timer; only the categories
# named in block_categories are downloaded and enforced. Hosts in
# never-intercept-hosts.conf are tunnelled raw and cannot be filtered.
# Hand-edited overrides in /etc/cache-proxy/: blocked-hosts.conf,
# allowed-hosts.conf, blocked-url-patterns.conf (re-read within ~10s).
[filtering]
enabled = false
lists_dir = "/var/lib/cache-proxy/filter-lists"
# Default only: the web UI Categories page saves the real selection to
# /etc/cache-proxy/filter-categories.conf, which overrides this when present.
block_categories = ["adult", "gambling", "malware", "phishing"]

# Where the lists come from. type: "ut1" (per-category tarball, {category} is
# filled in), "domains" (one domain per line) or "hosts" (hosts-file lines).
# Listing sources here REPLACES the built-in set, so keep the ones you want.
# refresh = "hourly" sources are also fetched every hour, 08:00-18:00 Monday
# to Friday, by cache-proxy-lists-hourly.timer (fast-moving threat feeds);
# every source is fetched daily regardless. Change the hours with
# "systemctl edit cache-proxy-lists-hourly.timer".
# auth_key_env names an environment variable (set in secrets.env) sent as an
# Auth-Key header.
[[filtering.sources]]
name = "ut1"          # Universite Toulouse Capitole, CC BY-SA 4.0
type = "ut1"
url = "https://dsi.ut-capitole.fr/blacklists/download/{category}.tar.gz"
# No "categories" key: offers every UT1 category; only the ones you enable
# on the web UI Categories page are downloaded.

[[filtering.sources]]
# UT1's own malware tarball currently contains the phishing list, so this
# category comes from their GitHub mirror instead.
name = "ut1-malware"
type = "domains"
url = "https://raw.githubusercontent.com/olbat/ut1-blacklists/master/blacklists/malware/domains"
category = "malware"

[[filtering.sources]]
name = "phishing-database"   # MIT
type = "domains"
url = "https://raw.githubusercontent.com/mitchellkrogza/Phishing.Database/master/phishing-domains-ACTIVE.txt"
category = "phishing"
refresh = "hourly"

[[filtering.sources]]
name = "urlhaus"     # abuse.ch; free fair-use, see their terms
type = "hosts"
url = "https://urlhaus.abuse.ch/downloads/hostfile/"
category = "malware"
auth_key_env = "CACHE_PROXY_URLHAUS_KEY"
refresh = "hourly"

# The page blocked users are sent to. url must be how clients reach this
# machine (hostname or IP, no port for 80), e.g. "http://cache-proxy.example.lan".
# Empty = no redirect: blocked requests just get an inline 403 page.
[blockpage]
url = ""
port = 80
message = "This site is blocked by your organisation's web policy."
# Unblock requests one client IP may send per hour.
max_requests_per_ip_per_hour = 5

# Outgoing mail for unblock requests. Put the password in
# /etc/cache-proxy/secrets.env as CACHE_PROXY_SMTP_PASSWORD, not here.
# Test it:  sudo -u cacheproxy /opt/cache-proxy/venv-proxy/bin/python3 -m cache_proxy.mailer --test
# (or use the "Send test email" button on the web UI Blocked page).
[email]
smtp_host = ""
smtp_port = 587
security = "starttls"      # starttls | ssl | none
username = ""
from_address = ""
unblock_recipient = ""

# Root/intermediate CAs mitmproxy should trust for the *upstream*
# (real-server) TLS connection, on top of certifi's bundle -- for vendor
# PKI hierarchies not in the public web root program. Windows Update is
# the built-in example: its "Update Secure Server CA" chains root at
# Microsoft's own CAs, which most Linux distros don't ship. A seed host's
# whole chain is discovered from one TLS handshake (each cert's Authority
# Information Access field points at the next one up) and cached in dir,
# so a routine CA rotation upstream needs no config change -- add a
# vendor here by adding one of its hostnames, not a certificate. Refreshed
# daily by the cache-proxy-vendor-cas timer; run it once by hand after
# install so the first clients aren't the ones finding a missing chain:
#   sudo -u cacheproxy /opt/cache-proxy/venv-proxy/bin/python3 -m cache_proxy.vendorcas update
[tls_trust]
enabled = true
dir = "/var/lib/cache-proxy/vendor-cas"
seed_hosts = [
    "fe2cr.update.microsoft.com",
    "tas02.sls.update.microsoft.com",
]
max_chain_depth = 6

[webui]
port = 443

# Login is required -- an empty username/password_hash locks the UI out
# entirely rather than serving it unauthenticated. Set a password with:
#   sudo /opt/cache-proxy/venv-webui/bin/python3 -m cache_proxy.webui.hash_password
# then paste the printed password_hash line below.
username = ""
password_hash = ""

# Self-signed by default (generated on install) -- browsers will warn on
# first visit. Point these at a real cert/key from your internal CA if
# you have one; nothing else needs to change.
tls_cert = "/etc/cache-proxy/webui-cert.pem"
tls_key = "/etc/cache-proxy/webui-key.pem"
