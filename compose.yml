services:
  cache-proxy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command:
      - /opt/cache-proxy/venv-proxy/bin/python3
      - -m
      - cache_proxy.supervisor
      - --listen-port
      - "8080"
      - --set
      - confdir=/var/lib/cache-proxy/mitmproxy-ca
      - -s
      - cache_proxy/addon.py
    ports:
      - "8080:8080"
    volumes:
      - cache-data:/var/lib/cache-proxy

  cache-webui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/bin/bash", "run_webui.sh"]
    # Dev-only demo login -- production uses whatever's set in
    # /etc/cache-proxy/config.toml on the real install, never this.
    environment:
      CACHE_PROXY_WEBUI_USERNAME: admin
      # Password is "cache-proxy-dev" -- dev-only, never used in production.
      CACHE_PROXY_WEBUI_PASSWORD_HASH: pbkdf2_sha256$$600000$$b142e0fda1afcdb045de638ab1eb798a$$a94fe8609a47c2ae433d98b79345801d7f8dc416e5622ff37a62fd47bfc0df41
    ports:
      - "8443:443"
    volumes:
      - cache-data:/var/lib/cache-proxy
    healthcheck:
      test: ["CMD", "curl", "-fk", "-u", "admin:cache-proxy-dev", "https://127.0.0.1:443/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The page blocked users are sent to. Demo only: listens on 8000 in the
  # container (the package uses port 80) and is published on host port 8081.
  cache-blockpage:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/bin/bash", "run_blockpage.sh"]
    environment:
      CACHE_PROXY_BLOCKPAGE_PORT: "8000"
    ports:
      - "8081:8000"
    volumes:
      - cache-data:/var/lib/cache-proxy

  # `docker compose run --rm test` runs the full pytest suite (both venvs)
  # against an ephemeral cache dir, not the persistent cache-data volume.
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["test"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/cache-proxy/venv-proxy/bin/pytest tests/test_store.py tests/test_config.py tests/test_addon_unit.py tests/test_addon_integration.py tests/test_ttl.py tests/test_analytics.py tests/test_supervisor.py tests/test_pool_integration.py tests/test_coalesce.py tests/test_contentfilter.py tests/test_filterlists.py -v &&
        /opt/cache-proxy/venv-webui/bin/pytest tests/test_store.py tests/test_config.py tests/test_auth.py tests/test_webui.py tests/test_blockpage.py tests/test_categories.py -v
    environment:
      CACHE_PROXY_DIR: /tmp/test-cache/files
      CACHE_PROXY_DB: /tmp/test-cache/index.db

volumes:
  cache-data:
