# Drop this file into /etc/apt-cacher-ng/ (flat directory, no conf.d/
# subdirectory -- apt-cacher-ng loads every *.conf file it finds there,
# in filename order; the "zzz_" prefix is its own convention for a file
# meant to override earlier settings). Verified against the real
# apt-cacher-ng 3.x package on Ubuntu 24.04.

# Default already listens on port 3142 on all interfaces/protocols --
# only override if you need something different.
# Port: 3142

# Days since an unreferenced package file was last requested before it's
# eligible for expiry. Default is 4, which is aggressive for a slow-moving
# internal mirror; 90 keeps things around much longer.
ExThreshold: 90

# Built-in status/browse page, enabled by default already, at
# http://<host>:3142/acng-report.html -- listed here for visibility.
# ReportPage: acng-report.html
