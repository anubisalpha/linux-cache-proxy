# RPM repo caching reverse proxy. apt-cacher-ng has no RPM/yum equivalent,
# so this does the same job with Nginx's proxy_cache: cache package files
# and repo metadata from known mirrors, browsable under /var/cache/nginx/rpm-cache
# (not human-named like the apt-cacher-ng pool, but same idea).
#
# Add one `location` block per mirror your fleet actually uses -- unlike
# apt-cacher-ng's automatic backend detection, Nginx needs each upstream
# declared explicitly.
#
# Install: apt-get install nginx (or dnf install nginx on an RPM-based cache
# host), drop this in /etc/nginx/conf.d/rpm-cache.conf, `nginx -t`, reload.

proxy_cache_path /var/cache/nginx/rpm-cache levels=1:2 keys_zone=rpm_cache:100m max_size=50g inactive=90d use_temp_path=off;

server {
    listen 8090;
    server_name rpm-cache;

    proxy_cache rpm_cache;
    proxy_cache_valid 200 90d;
    proxy_cache_key "$scheme$proxy_host$uri$is_args$args";
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_ssl_server_name on;

    # Rocky Linux
    location /rocky/ {
        proxy_pass https://dl.rockylinux.org/;
        proxy_set_header Host dl.rockylinux.org;
    }

    # AlmaLinux
    location /almalinux/ {
        proxy_pass https://repo.almalinux.org/;
        proxy_set_header Host repo.almalinux.org;
    }

    # Fedora / EPEL
    location /fedora/ {
        proxy_pass https://dl.fedoraproject.org/;
        proxy_set_header Host dl.fedoraproject.org;
    }
}
